# Optional override demonstrating a Kaleido-style architecture: the
# application (frontend + backend-api) talks to a generic ABI-driven REST
# gateway (kaleido-mock) instead of backend-api holding keys and talking to
# besu-rpc directly. Base docker-compose.yml is untouched and still works
# on its own — this only adds to it.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.kaleido.yml up -d --build
#
# See docs/kaleido-mock.md for what this demonstrates and why.
services:
  kaleido-mock:
    build: ./kaleido-mock
    container_name: kaleido-mock
    depends_on:
      - besu-rpc
    env_file:
      - ./.env.local
    environment:
      - BESU_RPC_URL=http://besu-rpc:8545
      - DEPLOYED_ADDRESSES_PATH=/app/deployed-addresses.json
    volumes:
      - ./deployed-addresses.json:/app/deployed-addresses.json:ro
    ports:
      - "5001:5001"
    networks:
      - besu-net

  backend-api:
    environment:
      - CHAIN_TRANSPORT=kaleido
      - KALEIDO_GATEWAY_URL=http://kaleido-mock:5001
    depends_on:
      - kaleido-mock
